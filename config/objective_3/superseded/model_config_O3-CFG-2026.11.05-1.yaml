# Objective 3 modelling configuration. Predeclared before any Objective 3 prediction is computed.
# A change of any value requires a new config_version; earlier versions are kept in config/objective_3/superseded/.
config_version: O3-CFG-2026.11.05-1
supersedes: null
revision_reason: >
  Initial Objective 3 configuration. It reads the approved DESIGN_8_2_v1 target and the Objective 2 continuity handoff,
  which is NOT_IDENTIFIABLE. M1 and M3 are therefore attempted with training-only variograms in every outer fold and
  recorded as NOT_ESTIMABLE or as an explicit ML-only fallback when support fails. No numeric result exists when this
  file was written.

target:
  label_rule_id: DESIGN_8_2_v1
  positive_state: POSITIVE
  negative_state: NEGATIVE
  excluded_states: [AMBIGUOUS, UNRESOLVED]
  require_approved_rule: true

geometry:
  horizontal_crs: EPSG:32630
  vertical: z_relative_m
  required_status: PROVISIONAL_RELATIVE
  absolute_elevation_allowed: false

features:
  predictors: [easting_m, northing_m, z_relative_m]
  # The three predictors are the only attributes that exist at every prediction location and are not derived from the
  # target. Weathering and lithology are logged only where a hole exists; rock type and mineral evidence define the label.
  forbidden_as_predictors: [hole_id, line_code, rock_code_raw, weathering_code, rock_code_status, label_state, indicator,
                            in_binary_target, design_label, is_sgs, has_gr_mineral, comment_raw, positive_indicators,
                            negative_indicators, evidence_pattern, depth_from_m, depth_to_m, midpoint_m,
                            interval_length_m, support_length_m, upstream_interval_id, upstream_interval_key]

splits:
  primary:
    split_plan_id: O3-SPLIT-LODO-1
    method: LEAVE_ONE_DRILL_LINE_OUT
    n_folds: 5
    min_train_lines: 2
    seed: 20261105
  secondary:
    split_plan_id: O3-SPLIT-HOLE-1
    method: GROUP_K_FOLD_BY_HOLE
    n_folds: 5
    seed: 20261105
    note: >
      Whole-hole blocked folds, deterministic from the sorted hole identifier. They are registered and audited as the
      secondary spatial plan. The primary out-of-fold predictions handed to Objective 4 come from the line-based plan.

inner_cv:
  method: GROUP_K_FOLD_BY_HOLE
  n_folds: 4
  seed: 20261105
  selection_metric: LOG_LOSS
  threshold_grid: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75]
  threshold_rule: MAX_YOUDEN_J_TIE_CLOSEST_TO_HALF

models:
  prevalence:
    candidate_run_id: BASE_PREVALENCE
    role: BASELINE
  logistic:
    candidate_run_id: BASE_LOGISTIC
    standardise: true
    grid:
      C: [0.01, 0.1, 1.0]
      class_weight: [null]
      max_iter: [2000]
  random_forest:
    candidate_run_id: M2_RF
    grid:
      n_estimators: [200]
      max_depth: [4, 8]
      min_samples_leaf: [5, 20]
      max_features: ["sqrt"]
  gradient_boosting:
    candidate_run_id: M2_HGB
    implementation: sklearn.ensemble.HistGradientBoostingClassifier
    note: >
      XGBoost is not installed in the verified environment. The audited gradient-boosting fallback is scikit-learn's
      HistGradientBoostingClassifier, which is histogram-based like XGBoost and supports the same early-stopping-free
      fixed-complexity training used here.
    grid:
      learning_rate: [0.05]
      max_iter: [150]
      max_leaf_nodes: [7, 31]
      min_samples_leaf: [20, 50]
      l2_regularization: [0.0, 1.0]
  m2_selection: INNER_CV_LOG_LOSS

variogram:
  family: LATERAL_BETWEEN
  lag_width_m: 20.0
  lag_max_m: 500.0
  max_abs_dz_m: 3.0
  min_pairs_per_bin: 100
  min_independent_hole_pairs_per_bin: 10
  min_supported_bins_for_fit: 5
  models: [spherical, exponential]
  weighting: CRESSIE_N_OVER_GAMMA2
  min_structured_sill_fraction: 0.05
  sill_factor: 1.5
  stability: LEAVE_ONE_LINE_OUT
  stable_if_range_ratio_between: [0.5, 2.0]
  require_stability_for_kriging: true
  kriging:
    estimator: SIMPLE_KRIGING
    mean: TRAINING_PREVALENCE
    depth_band: SAME_AS_VARIOGRAM      # uses max_abs_dz_m; the lateral variogram is defined only at similar depth
    min_neighbours: 5
    max_neighbours: 200
    jitter_fraction_of_sill: 0.00000001
    clip_to_unit_interval: true
    fallback_when_unsupported: TRAINING_MEAN

hybrid:
  trend: M2_SELECTED
  residual_definition: INDICATOR_MINUS_INNER_CROSS_FITTED_TREND
  residual_variogram: SAME_AS_INDICATOR_VARIOGRAM
  minimum_residual_bins: 5
  minimum_structured_sill_fraction: 0.05
  fallback: ML_ONLY
  fallback_status: FALLBACK_ML_ONLY
  clipping: CONSTRAINT_ONLY

calibration:
  method: PLATT
  minimum_inner_samples: 30
  clip_epsilon: 0.000001
  apply_to: [M2_RF, M2_HGB]
  not_applied_to: [BASE_PREVALENCE, BASE_LOGISTIC, M1_IK, M3_HYBRID]

seeds: [20261105]

gates:
  minimum_fold_class_count: 1
  maximum_clipped_fraction: 0.25
